<div class="diagrammer-layout">
  <header class="header">
    <div class="brand">
      <button class="btn-back" routerLink="/dashboard" title="Regresar al Dashboard">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      </button>
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
      </div>
      <div class="title-info">
        <h1>UML Architect</h1>
        <span class="project-name">{{ currentProject?.name }}</span>
      </div>
    </div>
    <div class="actions">
      <span class="stats">{{ elementCount }} elementos</span>
      <button class="btn-secondary" (click)="clearCanvas()">Limpiar</button>
      <button class="btn-outline" (click)="downloadJSON()">Exportar JSON</button>
      <button class="btn-primary" (click)="saveProject()">Guardar Cambios</button>
    </div>
  </header>

  <main class="main-body">
    <div class="toolbar-wrapper">
      <app-toolbar></app-toolbar>
    </div>
    
    <div class="canvas-wrapper">
      <app-canvas></app-canvas>
    </div>
  </main>

  <app-properties></app-properties>
</div>
