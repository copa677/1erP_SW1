<div class="diagrammer-layout">
  <header class="header">
    <div class="brand">
      <span class="logo">◈</span>
      <h1>UML Architect 2.5</h1>
    </div>
    <div class="stats">
       <span>Elementos: {{ elementCount }}</span>
    </div>
    <div class="actions">
      <button class="btn-secondary" (click)="clearCanvas()">Limpiar Lienzo</button>
      <button class="btn-outline" (click)="fileInput.click()">
        <input #fileInput type="file" (change)="onFileSelected($event)" accept=".json" style="display:none">
        Cargar Proyecto
      </button>
      <button class="btn-primary" (click)="saveProject()">Guardar Proyecto</button>
    </div>
  </header>

  <main class="main-body">
    <div class="toolbar-wrapper">
      <app-toolbar></app-toolbar>
    </div>
    
    <div class="canvas-wrapper">
      <app-canvas></app-canvas>
    </div>
  </main>

  <app-properties></app-properties>
</div>
