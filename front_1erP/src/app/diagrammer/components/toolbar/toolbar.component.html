<div class="toolbar-container">
  <div class="header">
    <h2>Librería UML</h2>
    <p>Arrastra objetos al lienzo</p>
  </div>

  <div class="groups-container">
    <div class="group">
      <div class="group-header">Elementos de Actividad</div>
      <div class="items-grid">
        <div class="tool-item" draggable="true" (dragstart)="onDragStart($event, 'activity')">
          <div class="icon rect"></div>
          <span>Actividad</span>
        </div>
        <div class="tool-item" draggable="true" (dragstart)="onDragStart($event, 'decision')">
          <div class="icon rhomb"></div>
          <span>Decisión</span>
        </div>
      </div>
    </div>

    <div class="group">
      <div class="group-header">Nodos de Control</div>
      <div class="items-grid">
        <div class="tool-item" draggable="true" (dragstart)="onDragStart($event, 'initial')">
          <div class="icon circle-fill"></div>
          <span>Inicio</span>
        </div>
        <div class="tool-item" draggable="true" (dragstart)="onDragStart($event, 'final')">
          <div class="icon circle-double"></div>
          <span>Fin</span>
        </div>
      </div>
    </div>

    <div class="group">
      <div class="group-header">Layout / Contenedores</div>
      <div class="items-grid">
        <div class="tool-item full" draggable="true" (dragstart)="onDragStart($event, 'swimlane')">
          <div class="icon lane"></div>
          <span>Carril (Swimlane)</span>
        </div>
      </div>
    </div>
  </div>

  <div class="footer-tips">
    <p>💡 Usa <b>Doble Clic</b> para editar propiedades</p>
    <p>💡 Usa <b>Clic Derecho</b> para mover la pizarra</p>
    <p>💡 Usa <b>Ctrl + Rueda</b> para zoom</p>
  </div>
</div>
